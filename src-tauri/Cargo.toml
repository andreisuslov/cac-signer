[package]
name = "cac-signer"
version = "0.1.0"
edition = "2021"

[lib]
name = "cac_signer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.47"
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"
x509-parser = "0.18"
chrono = "0.4"
sha1_smol = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-core-graphics", "objc2-core-foundation"] }
png = "0.18"
